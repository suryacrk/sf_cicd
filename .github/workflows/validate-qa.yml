name: Validate QA Environment

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  validate-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to QA Org via JWT
        run: |
          echo "${{ secrets.SFDX_SERVER_KEY_QA }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SFDX_CLIENT_ID_QA }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SFDX_USERNAME_QA }} \
            --instance-url https://login.salesforce.com \
            --alias QAOrg \
            --set-default
          rm server.key

      - name: Validate Source Deployment against QA
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org QAOrg \
            --wait 30
