name: Validate QA Environment

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  validate-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Secret scan: fails the run if a key, token or password was committed.
      # Repos owned by a GitHub organization also need a free license key:
      # add GITLEAKS_LICENSE as a repo secret and uncomment the env line below.
      - name: Scan for secrets (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # Static code scan (no org login needed, so it runs early and fails fast)
      - name: Install Code Analyzer plugin
        run: sf plugins install code-analyzer

      # Fails the job on High (2) or Critical (1) violations.
      # Use --severity-threshold 3 for a softer start.
      # Rules come from Recommended + cpd (copy/paste detection), plus any custom
      # rules in code-analyzer.yml at the repo root (loaded automatically).
      - name: Run Salesforce Code Analyzer
        run: |
          sf code-analyzer run \
            --workspace force-app \
            --target force-app \
            --rule-selector Recommended \
            --rule-selector cpd \
            --severity-threshold 2 \
            --output-file code-analyzer-results.html \
            --output-file code-analyzer-results.json

      - name: Upload Code Analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.*

      - name: Authenticate to QA Org via JWT
        run: |
          echo "${{ secrets.SFDX_SERVER_KEY_QA }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SFDX_CLIENT_ID_QA }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SFDX_USERNAME_QA }} \
            --instance-url https://login.salesforce.com \
            --alias QAOrg \
            --set-default
          rm server.key

      # Original validate step, plus explicit test level and coverage output.
      # RunLocalTests runs ALL local tests in the org and requires 75% coverage
      # averaged across every Apex class and trigger in the org.
      - name: Validate Source Deployment against QA
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org QAOrg \
            --wait 30 \
            --test-level RunLocalTests \
            --verbose \
            --coverage-formatters json-summary \
            --coverage-formatters text-summary \
            --junit \
            --results-dir test-results

      # Fails the PR below MIN_COVERAGE; skips if there is no Apex to measure
      - name: Enforce code coverage threshold
        env:
          MIN_COVERAGE: 75
        run: |
          SUMMARY=$(find test-results -name coverage-summary.json | head -n1)
          COVERAGE=$(jq -r '.total.lines.pct' "$SUMMARY")

          if [ "$COVERAGE" = "Unknown" ]; then
            echo "::notice::No coverable Apex lines in this deployment, skipping coverage gate."
            exit 0
          fi

          echo "Apex line coverage: ${COVERAGE}% (minimum ${MIN_COVERAGE}%)"
          awk -v c="$COVERAGE" -v m="$MIN_COVERAGE" 'BEGIN { exit (c+0 < m+0) }' \
            || { echo "::error::Coverage ${COVERAGE}% is below ${MIN_COVERAGE}%"; exit 1; }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: test-results

  # Emails the validation result (pass, fail or cancelled) to everyone in NOTIFY_EMAILS.
  # Runs even when validate-qa fails, because of `if: always()`.
  notify:
    name: Email validation result
    needs: validate-qa
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send validation result email
        # A mail problem (bad password, PR from a fork with no secrets) should never
        # turn your pipeline red, so this step is allowed to fail quietly.
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.NOTIFY_EMAILS }}
          from: "Salesforce CI <${{ secrets.MAIL_USERNAME }}>"
          subject: "${{ needs.validate-qa.result == 'success' && 'PASSED' || (needs.validate-qa.result == 'cancelled' && 'CANCELLED' || 'FAILED') }}: QA validation for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}"
          body: |
            QA validation result: ${{ needs.validate-qa.result }}

            Repository:  ${{ github.repository }}
            Pull request: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
            Author:      ${{ github.event.pull_request.user.login }}
            Branch:      ${{ github.head_ref }} -> ${{ github.base_ref }}
            Commit:      ${{ github.event.pull_request.head.sha }}

            Pull request: ${{ github.event.pull_request.html_url }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Code Analyzer and Apex test/coverage reports are attached to the run as artifacts.
