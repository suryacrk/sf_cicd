name: Validate QA Environment

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  validate-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      # Static code scan (no org login needed, so it runs early and fails fast)
      - name: Install Code Analyzer plugin
        run: sf plugins install code-analyzer

      # Fails the job on High (2) or Critical (1) violations.
      # Use --severity-threshold 3 for a softer start.
      - name: Run Salesforce Code Analyzer
        run: |
          sf code-analyzer run \
            --workspace force-app \
            --target force-app \
            --severity-threshold 2 \
            --output-file code-analyzer-results.html \
            --output-file code-analyzer-results.json

      - name: Upload Code Analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.*

      - name: Authenticate to QA Org via JWT
        run: |
          echo "${{ secrets.SFDX_SERVER_KEY_QA }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SFDX_CLIENT_ID_QA }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SFDX_USERNAME_QA }} \
            --instance-url https://login.salesforce.com \
            --alias QAOrg \
            --set-default
          rm server.key

      # Original validate step, plus explicit test level and coverage output
      - name: Validate Source Deployment against QA
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org QAOrg \
            --wait 30 \
            --test-level RunLocalTests \
            --coverage-formatters json-summary \
            --coverage-formatters text-summary \
            --junit \
            --results-dir test-results

      # Fails the PR below MIN_COVERAGE; skips if there is no Apex to measure
      - name: Enforce code coverage threshold
        env:
          MIN_COVERAGE: 75
        run: |
          SUMMARY=$(find test-results -name coverage-summary.json | head -n1)
          COVERAGE=$(jq -r '.total.lines.pct' "$SUMMARY")

          if [ "$COVERAGE" = "Unknown" ]; then
            echo "::notice::No coverable Apex lines in this deployment, skipping coverage gate."
            exit 0
          fi

          echo "Apex line coverage: ${COVERAGE}% (minimum ${MIN_COVERAGE}%)"
          awk -v c="$COVERAGE" -v m="$MIN_COVERAGE" 'BEGIN { exit (c+0 < m+0) }' \
            || { echo "::error::Coverage ${COVERAGE}% is below ${MIN_COVERAGE}%"; exit 1; }

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-test-results
          path: test-results
