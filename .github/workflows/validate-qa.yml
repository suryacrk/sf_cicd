name: Validate QA Deployment

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'force-app/**'

jobs:
  validate-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Install Salesforce Code Analyzer
        run: sf plugins install @salesforce/sfdx-scanner

      - name: Run Salesforce Code Analyzer
        run: |
          sf scanner scan \
            --target "force-app" \
            --engine "pmd,eslint-lwc" \
            --severity-threshold 2 \
            --format "table"

      - name: Authenticate to QA Org via JWT
        run: |
          echo "${{ secrets.SFDC_SERVER_KEY }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SFDC_CLIENT_ID }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SFDC_USERNAME }} \
            --instance-url https://test.salesforce.com \
            --alias QAOrg
          rm server.key

      - name: Validate Source Deployment against QA
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org QAOrg \
            --test-level RunLocalTests \
            --wait 30
