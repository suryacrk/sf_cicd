name: Validate QA Environment

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]

jobs:
  validate-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to QA Org
        run: |
          echo "${{ secrets.SFDX_AUTH_URL_QA }}" > auth.txt
          sf org login sfdx-url --sfdx-url-file auth.txt --alias QAOrg --set-default
          rm auth.txt

      - name: Run LWC Tests
        run: |
          npm ci
          npm test

      - name: Validate Source Deployment against QA
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org QAOrg \
            --test-level RunLocalTests \
            --wait 30