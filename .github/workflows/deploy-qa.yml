name: Deploy to QA Environment

on:
  push:
    branches:
      - develop

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to QA Org via JWT
        run: |
          echo "${{ secrets.SFDX_SERVER_KEY_QA }}" > server.key
          sf org login jwt \
            --client-id ${{ secrets.SFDX_CLIENT_ID_QA }} \
            --jwt-key-file server.key \
            --username ${{ secrets.SFDX_USERNAME_QA }} \
            --instance-url https://login.salesforce.com \
            --alias QAOrg \
            --set-default
          rm server.key

      - name: Deploy Source to QA
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org QAOrg \
            --wait 30
